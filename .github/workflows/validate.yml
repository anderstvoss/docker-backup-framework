name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          find scripts src tests \
            -type f \
            -perm -u+x \
            -print0 |
          sort -z |
          xargs -0 shellcheck

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(
            find scripts src tests \
              -type f \
              -perm -u+x \
              -print0
          )

          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(
            find config tests/fixtures \
              -type f \
              -name '*.conf' \
              -print0
          )

      - name: Regression tests
        shell: bash
        run: |
          set -euo pipefail

          for test in \
            tests/test-version \
            tests/test-resolve-snapshot \
            tests/test-install-preserve-config \
            tests/test-deployment-drill \
            tests/test-validate-group \
            tests/test-validate-group-manifest \
            tests/test-backup-result-files \
            tests/test-backup-group \
            tests/test-validate-application-recovery \
            tests/test-validate-application-recovery-mariadb \
            tests/test-validate-group-recovery \
            tests/test-restore-application-plan \
            tests/test-restore-application-path-safety \
            tests/test-restore-application-execute-boundary \
            tests/test-restore-application-execute-mariadb \
            tests/test-restore-group
          do
            echo "===== $test ====="
            "$test"
          done

      - name: Check disclosure patterns
        run: scripts/ci/check-disclosures

      - name: Validate install manifest sources
        shell: bash
        run: |
          set -euo pipefail

          awk '
            /^[[:space:]]*#/ || /^[[:space:]]*$/ { next }
            {
              split($0,a," -> ");
              print a[1]
            }
          ' packaging/install-manifest.txt |
          while read -r path; do
            if [ ! -e "$path" ]; then
              echo "Missing manifest source: $path" >&2
              exit 1
            fi
          done
