# Example configuration only.
# Application names and filesystem paths below are placeholders.
# Replace them with values appropriate for your deployment.

APP_NAME="example-app"

COMPOSE_DIR="/opt/docker/example-app"

DB_TYPE="mariadb"
DB_BACKUP_MODE="logical"
DB_CONTAINER="example-app-db"

# Optional application-specific semantic database validation.
# Configure both values together, or leave both unset.
# The query must return exactly one row and one column.
#
# Examples:
#
# Alembic:
# DB_VALIDATION_LABEL="alembic"
# DB_VALIDATION_QUERY="SELECT version_num FROM alembic_version LIMIT 1;"
#
# Laravel:
# DB_VALIDATION_LABEL="migration"
# DB_VALIDATION_QUERY="SELECT migration FROM migrations ORDER BY id DESC LIMIT 1;"

BACKUP_PATHS=(
  "/opt/docker/example-app"
  "/srv/docker/example-app/config"
  "/srv/docker/example-app/assets"
  "/srv/docker/example-app/resources"
  "/srv/docker/example-app/redis-data"
)

EXCLUDE_PATHS=(
  "/srv/docker/example-app/db"
  "/mnt/application-data/example-app"
)
