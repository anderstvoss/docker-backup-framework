# Example PostgreSQL application configuration only.
# Application names and filesystem paths below are placeholders.
# Replace them with values appropriate for your deployment.

APP_NAME="example-postgresql-app"

COMPOSE_DIR="/opt/docker/example-postgresql-app"

DB_TYPE="postgresql"
DB_BACKUP_MODE="logical"

# Docker Compose service name, not the generated container name.
DB_CONTAINER="example-postgresql-app-db"

# Optional application-specific semantic database validation.
# Configure both values together, or leave both unset.
# The query must return exactly one row and one column.
#
# Example numeric migration identity:
#
# DB_VALIDATION_LABEL="migration"
# DB_VALIDATION_QUERY="SELECT id FROM migration WHERE id ~ '^[0-9]+$' ORDER BY id DESC LIMIT 1;"

BACKUP_PATHS=(
  "/opt/docker/example-postgresql-app"
  "/srv/docker/example-postgresql-app/files"
)

# The live PostgreSQL data directory is intentionally excluded from
# filesystem backup because database state is captured through pg_dump.
EXCLUDE_PATHS=(
  "/srv/docker/example-postgresql-app/db"
)
