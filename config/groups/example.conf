# Docker Backup Framework group configuration example.
#
# A group is orchestration metadata only. Each member retains its own:
# - application configuration
# - Restic repository
# - Restic password
# - storage target/provider
# - portable recovery target
# - retention policy
#
# Group backups are coordinated and sequential, but are NOT globally atomic.

GROUP_NAME="example"

# Format:
#   application|repository|portable-target
#
# Each tuple must resolve to:
#   /etc/docker-backup/apps/<application>.conf
#   /etc/docker-backup/repos/<repository>.conf
#   /etc/docker-backup/portable/<portable-target>.conf
#
# The repository and portable configs must both reference the same APP_NAME
# named by the member.
GROUP_MEMBERS=(
    "app-one|app-one-operational|app-one"
    "app-two|app-two-operational|app-two"
)
