# Example configuration only.
# /mnt/backups/... and the NFS endpoint below are placeholders.
# Replace them with your actual backup mount and storage source.

PORTABLE_NAME="example-app"
APP_NAME="example-app"

BACKUP_ROOT="/mnt/backups/example-app/portable"

STORAGE_TYPE="nfs"
STORAGE_MOUNT="/mnt/backups/example-app"
EXPECTED_SOURCE="192.0.2.10:/exports/backups/example-app"

PORTABLE_SCHEDULE="*-*-* 01:00:00"
PORTABLE_RETENTION_SCHEDULE="*-*-* 01:30:00"
TIMERS_ENABLED="true"

KEEP_LAST=3
KEEP_DAILY=7
KEEP_WEEKLY=4
KEEP_MONTHLY=3
KEEP_YEARLY=0
