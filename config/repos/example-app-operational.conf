# Example configuration only.
# Paths, repository names, and storage endpoints below are placeholders.
# 192.0.2.10 is a documentation-only example address.

REPO_NAME="example-app-operational"
APP_NAME="example-app"

REPOSITORY="/mnt/backups/example-app/restic/operational"
PASSWORD_FILE="/etc/docker-backup/secrets/example-app-operational.password"

BACKUP_SCHEDULE="*-*-* 02:00:00"
RETENTION_SCHEDULE="*-*-* 03:00:00"
TIMERS_ENABLED="true"

KEEP_LAST=3
KEEP_DAILY=7
KEEP_WEEKLY=4
KEEP_MONTHLY=3
KEEP_YEARLY=0

CHECK_SCHEDULE="Sun *-*-* 04:00:00"
READ_DATA_CHECK_SCHEDULE="*-*-01 04:00:00"
PRUNE_SCHEDULE="*-*-02 04:00:00"

STORAGE_TYPE="nfs"
STORAGE_MOUNT="/mnt/backups/example-app"
EXPECTED_SOURCE="192.0.2.10:/exports/backups/example-app"
